name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Evaluate the example corpus
        run: |
          rag-lab eval \
            --docs examples/docs \
            --evalset examples/evalset.jsonl \
            --md-out reports/eval.md \
            --json-out reports/eval.json \
            --fail-under recall_at_k=0.9 \
            --fail-under groundedness=0.9
      - name: Publish eval summary
        if: matrix.python-version == '3.12'
        run: cat reports/eval.md >> "$GITHUB_STEP_SUMMARY"
